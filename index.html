<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 용량 줄이기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
  :root{--bg:#f5f6f8;--card:#fff;--text:#1d1f23;--sub:#6b7280;--accent:#3b6cf6;--line:#e3e6eb;--soft:#eef1f6}
  @media (prefers-color-scheme:dark){:root{--bg:#15171b;--card:#1f2228;--text:#eceef2;--sub:#9aa1ad;--line:#2e323a;--soft:#262a31}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif;padding-block:28px;padding-left:16px;padding-right:16px;-webkit-text-size-adjust:100%}
  main{max-width:600px;margin:auto}
  h1{font-size:22px;margin:0 0 6px}
  p.sub{color:var(--sub);margin:0 0 20px;font-size:14px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  #drop{border:2px dashed var(--line);border-radius:12px;padding:34px 14px;text-align:center;cursor:pointer}
  #drop.over{border-color:var(--accent);background:rgba(59,108,246,.06)}
  #fname{display:block;margin-top:8px;color:var(--sub);font-size:13px;line-height:1.5}
  .field{margin-top:18px}
  .field > span{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{flex:1 1 0;min-width:48px;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:9px 6px;font-size:14px;cursor:pointer;width:auto;margin:0}
  .chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .inline{display:flex;align-items:center;gap:8px}
  input[type=number]{width:86px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
  input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--accent);height:28px}
  .ticks{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:-2px}
  label.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin-top:16px}
  input[type=checkbox]{width:18px;height:18px}
  #estimate{background:var(--soft);border-radius:11px;padding:13px;margin-top:18px;font-size:14px;line-height:1.8}
  #estimate b{font-size:16px}
  .muted{color:var(--sub)}
  button.main{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}
  button.main:disabled{opacity:.45}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:14px}
  .bar div{height:100%;width:0;background:var(--accent);transition:width .25s}
  #status{margin-top:10px;color:var(--sub);font-size:14px;line-height:1.5}
  video{width:100%;border-radius:10px;margin-top:12px;background:#000}
  .save{display:block;width:100%;text-align:center;border:0;border-radius:11px;padding:14px;margin-top:10px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer}
  #save{background:#16a34a;color:#fff}
  #dl{background:var(--soft);color:var(--text);border:1px solid var(--line)}
  #hint{color:var(--sub);font-size:13px;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>🎬 영상 용량 줄이기</h1>
  <p class="sub">영상을 넣으면 원하는 용량 이하로 줄여줍니다. 파일은 서버로 올라가지 않고 내 휴대폰·컴퓨터 안에서만 처리돼요.</p>

  <div class="card" id="inapp" hidden style="border-color:#f59e0b;background:rgba(245,158,11,.08)">
    <strong>⚠️ 카카오톡·인스타 안에서 열면 저장이 안 돼요</strong>
    <p class="sub" style="margin:8px 0 0">앱 안에 들어 있는 간이 브라우저는 파일 저장을 막아 둡니다. 아래 버튼으로 <b>Chrome</b>에서 열어 주세요.
      (버튼이 안 되면 오른쪽 위 <b>⋮</b> → <b>다른 브라우저로 열기</b>)</p>
    <a class="save" id="openChrome" style="background:#f59e0b;color:#fff;margin-top:12px">Chrome으로 열기</a>
    <button class="save" id="copyLink" style="background:var(--soft);color:var(--text);border:1px solid var(--line)">주소 복사하기</button>
  </div>

  <div class="card">
    <div id="drop">영상을 여기에 넣거나 눌러서 선택<span id="fname"></span></div>
    <input type="file" id="file" accept="video/*" hidden>

    <div class="field">
      <span>목표 용량</span>
      <div class="chips" id="sizeChips">
        <button data-mb="8">8MB</button>
        <button data-mb="10" aria-pressed="true">10MB</button>
        <button data-mb="20">20MB</button>
        <button data-mb="50">50MB</button>
      </div>
      <div class="inline" style="margin-top:8px">
        <span class="muted" style="font-size:14px">직접 입력</span>
        <input type="number" id="target" value="10" min="1" max="2000" step="1"> <span class="muted">MB</span>
      </div>
    </div>

    <div class="field">
      <span>배속 <b id="speedVal" style="color:var(--accent)">1배</b> <span class="muted" style="font-weight:400">— 빠르게 할수록 용량도 줄어요</span></span>
      <input type="range" id="speed" min="0.5" max="15" step="0.5" value="1">
      <div class="ticks"><span>0.5배</span><span>5배</span><span>10배</span><span>15배</span></div>
      <div id="speedNote" class="muted" style="font-size:13px;margin-top:6px" hidden></div>
    </div>

    <label class="check"><input type="checkbox" id="mute"> 소리 빼기 (용량을 조금 더 줄여요)</label>

    <div id="estimate" hidden></div>
    <button class="main" id="go" disabled>압축 시작</button>
    <div class="bar"><div id="prog"></div></div>
    <div id="status"></div>
  </div>

  <div class="card" id="result" hidden>
    <strong>결과</strong>
    <div id="info" class="muted" style="margin-top:6px;font-size:14px;line-height:1.6"></div>
    <video id="out" controls playsinline></video>
    <button class="save" id="save" hidden>📱 갤러리에 저장 / 공유</button>
    <a class="save" id="dl">⬇️ 파일로 저장</a>
    <div id="hint"></div>
  </div>
</main>

<script type="module">
import { probe, plan as makePlan, compress } from './compress.js';

const $ = id => document.getElementById(id);
const MB = 1048576;
const fmt = b => (b / MB).toFixed(2) + 'MB';
const clock = s => s < 60 ? `${Math.round(s)}초` : `${Math.floor(s / 60)}분 ${Math.round(s % 60)}초`;

let file = null, meta = null, speed = 1;
const opts = () => ({ targetMB: Math.max(1, +$('target').value || 10), speed, mute: $('mute').checked });

/* ---------- 앱 안의 간이 브라우저(WebView) 감지 ----------
   카카오톡·인스타그램 등에서 링크를 누르면 앱 안의 간이 브라우저가 열린다.
   거기서는 navigator.share 가 없고 blob: 다운로드도 조용히 막혀서
   ("지원하지 않는 파일 형식입니다") 아무것도 저장되지 않는다. 그래서 Chrome 으로 보낸다. */
const UA = navigator.userAgent || '';
const inApp = /KAKAOTALK|FBAN|FBAV|FB_IAB|Instagram|NAVER\(inapp|DaumApps|Line\/|Snapchat|KAKAOSTORY/i.test(UA)
  || (/Android/i.test(UA) && /; wv\)/i.test(UA));   // 안드로이드 WebView 표시
if (inApp) {
  $('inapp').hidden = false;
  const url = location.href.split('#')[0];
  $('openChrome').href = /Android/i.test(UA)
    ? `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`
    : url;   // iPhone 은 인앱 브라우저의 '사파리로 열기' 안내를 따른다
  $('copyLink').onclick = async () => {
    try { await navigator.clipboard.writeText(url); $('copyLink').textContent = '복사했어요! 브라우저에 붙여넣으세요'; }
    catch { prompt('이 주소를 복사해서 브라우저에 붙여넣으세요', url); }
  };
}

/* ---------- 파일 선택 ---------- */
$('drop').onclick = () => $('file').click();
$('file').onchange = e => pick(e.target.files[0]);
['dragover', 'dragenter'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => pick(e.dataTransfer.files[0]));

async function pick(f) {
  if (!f || !f.type.startsWith('video/')) return;
  file = f; meta = null;
  $('fname').textContent = `${f.name} · ${fmt(f.size)} · 확인 중...`;
  $('go').disabled = true;
  $('result').hidden = true;
  try {
    meta = await probe(f);
    $('fname').textContent = `${f.name} · ${fmt(f.size)} · ${meta.w}×${meta.h} · ${clock(meta.dur)}`;
    $('go').disabled = false;
  } catch (e) {
    $('fname').textContent = '이 영상은 브라우저에서 열 수 없어요. 다른 파일을 써주세요.';
  }
  refresh();
}

/* ---------- 설정 ---------- */
function chips(box, fn) {
  $(box).onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(box).children].forEach(c => c.setAttribute('aria-pressed', c === b));
    fn(b); refresh();
  };
}
chips('sizeChips', b => { $('target').value = b.dataset.mb; });

$('speed').oninput = () => {
  speed = +$('speed').value;
  $('speedVal').textContent = `${speed}배`;
  // 높은 배속은 영상 해독이 못 따라가서 실제로는 덜 빨라질 수 있다 (누르면 실제 속도를 재서 보여준다)
  $('speedNote').hidden = speed < 6;
  $('speedNote').textContent = speed >= 6
    ? '높은 배속은 기기 성능을 많이 타요. 실제 속도가 설정보다 낮아지고 움직임이 조금 끊겨 보일 수 있어요. 소리도 알아듣기 어려우니 「소리 빼기」와 같이 쓰면 좋아요.'
    : '';
  refresh();
};
$('target').oninput = () => {
  [...$('sizeChips').children].forEach(c => c.setAttribute('aria-pressed', c.dataset.mb === $('target').value));
  refresh();
};
$('mute').onchange = refresh;

/* ---------- 예상치 미리보기 ---------- */
const quality = bps => bps > 2000000 ? '아주 좋음' : bps > 1000000 ? '좋음' : bps > 500000 ? '보통' : bps > 250000 ? '조금 흐림' : '많이 흐림';

function refresh() {
  if (!file || !meta) { $('estimate').hidden = true; return; }
  const p = makePlan(meta, opts());
  $('estimate').hidden = false;
  $('estimate').innerHTML = `
    예상 용량 <b>최대 ${fmt(p.estBytes)}</b> <span class="muted">(보통 이보다 작게 나와요)</span> ${p.limitedBySource ? '<span class="muted">(원본 화질이 한계라 목표보다 작게 나와요)</span>' : `<span class="muted">(목표 ${p.targetMB}MB 이하)</span>`}<br>
    예상 화질 <b>${p.w}×${p.h}</b> <span class="muted">· ${quality(p.videoBps)}</span><br>
    영상 길이 <b>${clock(p.outDur)}</b> <span class="muted">${speed !== 1 ? `· ${speed}배속 (원본 ${clock(meta.dur)})` : ''}${p.mute ? ' · 소리 없음' : ''}</span><br>
    <span class="muted">걸리는 시간 약 ${clock(p.outDur)}${speed >= 6 ? ' 이상' : ''} — 영상을 재생하면서 압축해요</span>`;
}

/* ---------- 압축 ---------- */
$('go').onclick = async () => {
  $('go').disabled = true; $('result').hidden = true;
  let wake = null;
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
  try {
    const est = makePlan(meta, opts());
    const r = await compress(file, meta, opts(), {
      onProgress: f => { $('prog').style.width = (f * 100).toFixed(1) + '%'; },
      onAttempt: n => {
        $('prog').style.width = '0%';
        $('status').textContent = n === 1
          ? `압축 중... 약 ${clock(est.outDur)} 걸려요. 화면을 켜 둔 채 기다려 주세요.`
          : `조금 더 줄이는 중... (${n}번째 시도)`;
      },
      onMeasure: () => { $('status').textContent = '실제 배속을 재는 중...'; },
      onPause: paused => {
        if (paused) $('status').textContent = '⏸ 다른 화면으로 넘어가서 잠시 멈췄어요. 이 화면으로 돌아오면 이어서 합니다.';
        else $('status').textContent = '다시 압축하는 중...';
      },
    });
    show(r.blob, r.plan, r.withinTarget, r.warnings, r.actualSpeed);
  } catch (e) {
    $('status').textContent = '오류: ' + e.message;
  } finally {
    wake?.release?.();
    $('go').disabled = false;
  }
};

/* ---------- 결과 / 저장 ---------- */
function show(blob, p, ok, warnings = [], actualSpeed = 0) {
  const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
  // 파일 이름에 한글이 있으면 일부 앱이 거부해서 영문·숫자만 쓴다
  const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
  const name = `video_${stamp}.${ext}`;
  const url = URL.createObjectURL(blob);
  $('out').src = url;
  $('dl').href = url;
  $('dl').download = name;
  // 실제로 나온 배속이 설정값보다 낮으면 (해독 속도 한계) 그대로 알려준다
  const shown = actualSpeed ? Math.round(actualSpeed * 10) / 10 : speed;
  const speedText = speed === 1 ? ''
    : ` · ${shown}배속${actualSpeed && shown < speed - 0.3 ? ` <span class="muted">(${speed}배로 설정했지만 기기 속도가 여기까지예요)</span>` : ''}`;
  $('info').innerHTML = `${fmt(file.size)} → <b>${fmt(blob.size)}</b> · ${p.w}×${p.h} · ${ext.toUpperCase()}`
    + `${speedText}${p.mute ? ' · 소리 없음' : ''}`
    + (ok ? '' : `<br><span style="color:#dc2626">목표 ${p.targetMB}MB를 넘었어요. 배속을 올리거나 목표를 키워보세요.</span>`)
    + warnings.map(w => `<br><span style="color:#dc2626">⚠️ ${w}</span>`).join('');
  $('status').textContent = '완료!';
  $('prog').style.width = '100%';

  // 공유는 반드시 클릭 핸들러 안에서 곧바로 호출해야 한다 (await 를 끼우면 안드로이드가 막는다)
  const f = new File([blob], name, { type: blob.type });
  const canShare = navigator.canShare && navigator.canShare({ files: [f] });
  $('save').hidden = !canShare;
  $('save').onclick = () => {
    navigator.share({ files: [f] }).catch(err => {
      if (err && err.name === 'AbortError') return;          // 사용자가 취소한 것 — 무시
      $('hint').insertAdjacentHTML('afterbegin',
        `<div style="color:#dc2626">공유에 실패했어요 (${err && err.name || err}). 아래 <b>파일로 저장</b>을 써주세요.</div>`);
    });
  };
  $('hint').innerHTML = canShare
    ? `<b>iPhone</b> 공유 창에서 <b>비디오 저장</b>을 누르면 사진 앱에 들어가요.<br>
       <b>갤럭시·안드로이드</b> 공유 창에서 <b>갤러리</b>나 <b>Google 포토</b>를 고르세요. 목록에 없으면 아래 <b>파일로 저장</b>을 누른 뒤, 갤러리 앱의 <b>앨범 → Download</b>에서 확인하세요.`
    : `저장한 파일은 <b>다운로드</b> 폴더에 들어가요. 휴대폰이면 갤러리 앱의 <b>앨범 → Download</b>에서 확인하세요.`;
  $('result').hidden = false;
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
